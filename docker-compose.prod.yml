# Production overlay.
#
# `migrate` is a one-shot service that must exit successfully before web and
# worker start, so new code never meets an old schema. The database port is not
# published: only the compose network reaches it.

services:
  migrate:
    build:
      context: .
      target: runner
    restart: 'no'
    command: ['node', 'dist-worker/migrate.js']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: UTC
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    deploy:
      replicas: 1
    command: ['node', 'dist-worker/worker.js']
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
